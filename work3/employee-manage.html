<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>企业人事考勤管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/employee-manage.css">
</head>
<body>
    <!-- 全局页面容器 单页路由切换 -->
    <div class="page-container">
        <!-- 首页概览页 -->
        <div class="page active" id="homePage">
            <div class="page-header">
                <h1><i class="fa fa-id-card-o"></i> 人事管理工作台</h1>
                <!-- 日期选择器 放在首页左上角 -->
                <div class="date-select-wrap">
                    <i class="fa fa-calendar"></i>
                    <input type="date" id="attendanceDatePicker">
                </div>
            </div>

            <!-- 核心统计卡片 -->
            <div class="overview-stat-wrap">
                <div class="overview-card">
                    <p class="big-num" id="totalStaffCount">0</p>
                    <p class="card-label">在职总员工数</p>
                </div>
                <div class="overview-card">
                    <p class="big-num" id="formalStaffCount">0</p>
                    <p class="card-label">正式员工数</p>
                </div>
                <div class="overview-card">
                    <p class="big-num" id="internStaffCount">0</p>
                    <p class="card-label">实习员工数</p>
                </div>
            </div>

            <!-- 三大功能入口卡片 -->
            <div class="entry-card-group">
                <div class="entry-card" data-target="allStaffPage">
                    <div class="entry-icon blue">
                        <i class="fa fa-users"></i>
                    </div>
                    <div class="entry-text">
                        <h3>全部在职员工</h3>
                        <p>查看所有在职员工完整信息</p>
                    </div>
                    <i class="fa fa-angle-right arrow-icon"></i>
                </div>
                <div class="entry-card" data-target="resignedPage">
                    <div class="entry-icon gray">
                        <i class="fa fa-user-times"></i>
                    </div>
                    <div class="entry-text">
                        <h3>已离职员工</h3>
                        <p>历史离职员工档案备查</p>
                    </div>
                    <i class="fa fa-angle-right arrow-icon"></i>
                </div>
                <div class="entry-card" data-target="internPage">
                    <div class="entry-icon purple">
                        <i class="fa fa-user-circle-o"></i>
                    </div>
                    <div class="entry-text">
                        <h3>实习员工管理</h3>
                        <p>实习期员工专属管理</p>
                    </div>
                    <i class="fa fa-angle-right arrow-icon"></i>
                </div>
            </div>
        </div>

        <!-- 考勤统计详情页 -->
        <div class="page" id="attendanceStatPage">
            <div class="page-header">
                <div class="back-btn" onclick="goBack()">
                    <i class="fa fa-angle-left"></i> 返回
                </div>
                <h1 id="attendancePageTitle">2026-08-15 考勤统计</h1>
            </div>
            <div class="attendance-stat-card-wrap">
                <div class="att-stat-card normal">
                    <p class="att-num" id="normalAttCount">0</p>
                    <p class="att-label">正常出勤</p>
                </div>
                <div class="att-stat-card late">
                    <p class="att-num" id="lateAttCount">0</p>
                    <p class="att-label">迟到</p>
                </div>
                <div class="att-stat-card leave">
                    <p class="att-num" id="leaveAttCount">0</p>
                    <p class="att-label">请假/休假</p>
                </div>
            </div>
            <div class="attendance-list-wrap" id="attendanceListWrap">
                <!-- 当日考勤员工列表动态渲染 -->
            </div>
        </div>

        <!-- 全部在职员工页 -->
        <div class="page" id="allStaffPage">
            <div class="page-header">
                <div class="back-btn" onclick="goBack()">
                    <i class="fa fa-angle-left"></i> 返回
                </div>
                <h1>全部在职员工</h1>
            </div>
            <div class="search-bar">
                <i class="fa fa-search"></i>
                <input type="text" id="allStaffSearch" placeholder="搜索姓名/工号/部门">
            </div>
            <div class="staff-list" id="allStaffListWrap">
                <!-- 全部在职员工列表动态渲染 -->
            </div>
        </div>

        <!-- 已离职员工页 -->
        <div class="page" id="resignedPage">
            <div class="page-header">
                <div class="back-btn" onclick="goBack()">
                    <i class="fa fa-angle-left"></i> 返回
                </div>
                <h1>已离职员工档案</h1>
            </div>
            <div class="staff-list" id="resignedStaffListWrap">
                <!-- 离职员工列表动态渲染 -->
            </div>
        </div>

        <!-- 实习员工页 -->
        <div class="page" id="internPage">
            <div class="page-header">
                <div class="back-btn" onclick="goBack()">
                    <i class="fa fa-angle-left"></i> 返回
                </div>
                <h1>实习员工管理</h1>
            </div>
            <div class="staff-list" id="internStaffListWrap">
                <!-- 实习员工列表动态渲染 -->
            </div>
        </div>
    </div>

    <!-- 悬浮新增员工按钮 仅在员工列表页显示 -->
    <button class="add-fab-btn" id="addStaffBtn" style="display: none;">
        <i class="fa fa-user-plus"></i>
    </button>

    <!-- 新增/编辑员工弹窗 -->
    <div class="modal-mask" id="operateModal">
        <div class="modal-box">
            <h3 class="modal-title" id="modalTitle">新增员工信息</h3>
            <!-- 头像上传区域 -->
            <div class="avatar-upload-area">
                <div class="upload-avatar" id="previewAvatar">
                    <i class="fa fa-camera"></i>
                    <input type="file" id="avatarUploadInput" accept="image/*" hidden>
                </div>
                <p class="upload-tip">点击上传员工头像</p>
            </div>

            <div class="form-group">
                <label>员工姓名</label>
                <input type="text" id="inputName" placeholder="请输入员工姓名">
            </div>
            <div class="form-group">
                <label>身份证号码</label>
                <input type="text" id="inputIdCard" placeholder="请输入18位身份证号">
            </div>
            <div class="form-group">
                <label>联系手机号</label>
                <input type="tel" id="inputPhone" placeholder="请输入11位手机号">
            </div>
            <div class="form-group">
                <label>所属部门</label>
                <input type="text" id="inputDept" placeholder="请输入所属部门">
            </div>
            <div class="form-group">
                <label>员工工号</label>
                <input type="text" id="inputJobNum" placeholder="请输入员工工号">
            </div>
            <div class="form-group">
                <label>员工身份</label>
                <select id="inputIdentity">
                    <option value="正式员工">正式员工</option>
                    <option value="实习员工">实习员工</option>
                </select>
            </div>
            <div class="form-group">
                <label>员工状态</label>
                <select id="inputStaffStatus">
                    <option value="在职">在职</option>
                    <option value="已离职">已离职</option>
                </select>
            </div>
            <div class="form-group">
                <label>考勤日期</label>
                <input type="date" id="inputAttendanceDate">
            </div>
            <div class="form-group">
                <label>当日考勤状态</label>
                <select id="inputAttendanceStatus">
                    <option value="正常出勤">正常出勤</option>
                    <option value="迟到">迟到</option>
                    <option value="请假">请假</option>
                    <option value="休假">休假</option>
                </select>
            </div>
            <div class="form-group" id="leaveReasonWrap" style="display: none;">
                <label>请假原因</label>
                <input type="text" id="inputLeaveReason" placeholder="请输入请假原因">
            </div>
            <div class="btn-group">
                <button class="cancel-btn" id="cancelOperateBtn">取消</button>
                <button class="confirm-btn" id="confirmOperateBtn">确认保存</button>
            </div>
        </div>
    </div>

    <!-- 全局提示 -->
    <div class="toast" id="globalToast"></div>

    <script src="./js/employee-manage.js"></script>
</body>
</html>
